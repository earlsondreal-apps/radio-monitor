<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Radio Monitor</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #333; }
        .freq { font-size: 3rem; color: #00d1ff; text-align: center; margin: 10px 0; font-weight: bold; }
        .label { color: #888; font-size: 0.8rem; text-transform: uppercase; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: #252525; padding: 10px; border-radius: 8px; }
        .now-playing { border-top: 1px solid #333; margin-top: 20px; padding-top: 20px; text-align: center; }
        .error-msg { color: #ff4444; font-size: 0.8rem; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="label">Hardware Status: <span id="status" style="color: #ff4444;">Offline</span></div>
    
    <div class="freq" id="freq_str">--.- FM</div>

    <div class="now-playing">
        <div class="label">Now Playing</div>
        <div id="title" style="font-weight: bold; margin-top: 5px;">Waiting for data...</div>
        <div id="artist" style="color: #888;">---</div>
    </div>

    <div class="stat-grid">
        <div class="stat-box">
            <div class="label">Signal (RSSI)</div>
            <div id="rssi" style="font-size: 1.2rem;">0</div>
        </div>
        <div class="stat-box">
            <div class="label">HD Status</div>
            <div id="hd_status" style="font-size: 0.9rem;">--</div>
        </div>
    </div>
    
    <div id="error" class="error-msg">Connection Blocked. Check IP or Proxy.</div>
</div>

<script>
    // --- CONFIGURATION ---
    const HARDWARE_IP = '192.168.1.100'; // Change to your hardware's local IP
    const DATA_PATH = '/status.json';    // The page on your hardware
    
    // We use a public CORS proxy to "bridge" the request
    const PROXY_URL = 'https://api.allorigins.win/get?url=';

    async function updateDisplay() {
        const fullUrl = `http://${HARDWARE_IP}${DATA_PATH}`;
        const target = PROXY_URL + encodeURIComponent(fullUrl);

        try {
            const response = await fetch(target);
            const wrapper = await response.json(); // The proxy wraps the data in a "contents" string
            const data = JSON.parse(wrapper.contents);

            // Mapping your specific JSON keys
            document.getElementById('freq_str').innerText = data.freq_str;
            document.getElementById('title').innerText = data.title || data.ps || "No Title";
            document.getElementById('artist').innerText = data.artist || "Unknown Artist";
            document.getElementById('rssi').innerText = data.rssi + " dBm";
            document.getElementById('hd_status').innerText = data.hd_status;

            document.getElementById('status').innerText = 'Online';
            document.getElementById('status').style.color = '#00ff88';
            document.getElementById('error').style.display = 'none';

        } catch (err) {
            document.getElementById('status').innerText = 'Offline';
            document.getElementById('status').style.color = '#ff4444';
            document.getElementById('error').style.display = 'block';
        }
    }

    setInterval(updateDisplay, 2000);
    updateDisplay();
</script>

</body>
</html>
